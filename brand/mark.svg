<!--
  Adobe MCP mark — the Moskito EYE family.

  Same silhouette as the EYE mark: the mosquito's compound eye, asymmetric,
  with an offset pupil. Recoloured to the TeamOrg/EYE primary so the two read
  as one family rather than two products, and the pupil carries the darker
  primary so this one is still distinguishable at a glance.
-->
