<!--
  macOS app icon.

  One transform, not nested ones: the 1406-unit artwork is scaled to 840 and
  inset by 92 on each side, which is the ~9% transparent margin macOS icons
  are drawn with. The previous version nested two scales and pushed most of
  the mark off the canvas, leaving a corner fragment.
-->
