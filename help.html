<style>
:root {
  --bg: #f4f7fb;
  --card: #ffffff;
  --ink: #111827;
  --ink-soft: #64748b;
  --line: #e2e8f0;
  --accent: #2855ff;
  --shadow: 0 1px 2px rgba(20,20,30,.06), 0 8px 24px rgba(20,20,30,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131317; --card: #1c1c22; --ink: #f2f2f5; --ink-soft: #9a9aa6;
    --line: #2b2b34; --accent: #7b93ff;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #131317; --card: #1c1c22; --ink: #f2f2f5; --ink-soft: #9a9aa6;
  --line: #2b2b34; --accent: #7b93ff;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.6 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }

a { color: var(--accent); }
.topbar { display: flex; align-items: baseline; gap: 12px; margin-bottom: 26px; }
.back { flex: 1 1 auto; font-size: 13.5px; color: var(--ink-soft); text-decoration: none; }
.back:hover { color: var(--ink); }
/* The page takes its language from the system; this is for the people that
   setting is wrong for. */
.langs { display: flex; gap: 4px; }
.langs button {
  border: 0; background: none; padding: 3px 7px; border-radius: 6px; cursor: pointer;
  font: inherit; font-size: 12.5px; color: var(--ink-soft);
}
.langs button:hover { color: var(--ink); }
.langs button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 560; }

h1 { font-size: 28px; line-height: 1.25; margin: 0 0 10px; letter-spacing: -.02em; }
.lede { font-size: 16px; color: var(--ink-soft); margin: 0 0 30px; }

h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--ink-soft); font-weight: 620; margin: 36px 0 10px;
}

/* <details> rather than a hand-rolled toggle: the keyboard handling, the
   open state and the semantics come free with the element. */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); margin-bottom: 8px; overflow: hidden;
}
.card > summary {
  list-style: none; cursor: pointer; padding: 14px 18px;
  display: flex; align-items: center; gap: 11px;
}
.card > summary::-webkit-details-marker { display: none; }
.card > summary:hover { background: var(--bg); }
.card > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.card summary img { width: 24px; height: 24px; border-radius: 6px; flex: none; }
.card summary .name { font-size: 16px; font-weight: 600; flex: 1 1 auto; }
.card summary .chev {
  flex: none; width: 13px; height: 13px; color: var(--ink-soft);
  transition: transform .15s;
}
.card[open] > summary .chev { transform: rotate(90deg); }
.card[open] > summary { border-bottom: 1px solid var(--line); }
.body { padding: 16px 18px 18px; }
.body > p { margin: 0 0 14px; color: var(--ink-soft); font-size: 14px; }

.can { margin: 0; padding: 0; list-style: none; }
.can li { margin: 7px 0; padding-left: 16px; position: relative; font-size: 14.5px; }
.can li::before {
  content: ""; position: absolute; left: 0; top: .62em;
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
}
.can b { font-weight: 600; }

/* Example prompts are the point of the page: they show the register to write
   in, which is the thing people get wrong. */
.say { margin: 14px 0 0; border-top: 1px solid var(--line); padding-top: 14px; }
.say .label, .nope .label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink-soft); font-weight: 620; margin-bottom: 8px;
}
.say q {
  display: block; margin: 3px 0; font-size: 14.5px; quotes: "\201c" "\201d";
  color: var(--ink); flex: 1 1 auto;
}
.say q::before, .say q::after { color: var(--ink-soft); }

/* The prompts are here to be used, so make taking one a click. The row is the
   hit area; the icon only says where. */
.say .row {
  display: flex; align-items: baseline; gap: 8px; border-radius: 7px;
  margin: 0 -8px; padding: 3px 8px;
}
.say .row:hover { background: var(--bg); }
.copy {
  flex: none; border: 0; background: none; padding: 4px; border-radius: 6px;
  color: var(--ink-soft); opacity: .45; cursor: pointer; line-height: 0;
  transition: opacity .12s, color .12s;
}
.say .row:hover .copy, .copy:focus-visible { opacity: 1; }
.copy:hover { color: var(--accent); }
.copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.copy.done { color: var(--accent); opacity: 1; }
.copy svg { width: 14px; height: 14px; display: block; }

.nope { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
.nope p { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.nope b { color: var(--ink); font-weight: 560; }

.note {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; font-size: 14px; color: var(--ink-soft); margin-bottom: 8px;
}
.note b { color: var(--ink); font-weight: 560; }

footer { margin-top: 44px; font-size: 13.5px; text-align: center; }
.sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
</style>

  btn.type = "button";
  btn.innerHTML = COPY_ICON;
  btn.title = t.copyLabel;
  btn.setAttribute("aria-label", t.copyLabel);
  btn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // Not every context grants the clipboard API; the old way still works.
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch {}
      ta.remove();
    }
    btn.innerHTML = TICK_ICON;
    btn.classList.add("done");
    said.textContent = t.copied;
    setTimeout(() => {
      btn.innerHTML = COPY_ICON;
      btn.classList.remove("done");
    }, 1400);
  };
  row.appendChild(btn);
  return row;
}

function cardEl(c, t) {
  const card = document.createElement("details");
  card.className = "card";
  if (c.id) {
    card.id = c.id;
    if (location.hash === "#" + c.id) card.open = true;
  }

  const summary = document.createElement("summary");
  if (c.icon) {
    const img = document.createElement("img");
    img.src = "/api/icon/" + c.icon;
    img.alt = "";
    img.onerror = () => img.remove();
    summary.appendChild(img);
  }
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = c.name;
  summary.appendChild(name);
  summary.insertAdjacentHTML("beforeend", CHEVRON);
  card.appendChild(summary);

  const body = document.createElement("div");
  body.className = "body";

  if (c.blurb) {
    const p = document.createElement("p");
    p.textContent = c.blurb;
    body.appendChild(p);
  }

  const ul = document.createElement("ul");
  ul.className = "can";
  for (const [bold, rest] of c.can) {
    const li = document.createElement("li");
    li.innerHTML = "<b>" + esc(bold) + "</b> — " + esc(rest);
    ul.appendChild(li);
  }
  body.appendChild(ul);

  if (c.say && c.say.length) {
    const say = document.createElement("div");
    say.className = "say";
    say.innerHTML = '<div class="label">' + esc(t.sayLabel) + "</div>";
    for (const s of c.say) say.appendChild(promptRow(s, t));
    body.appendChild(say);
  }

  if (c.cannot) {
    const nope = document.createElement("div");
    nope.className = "nope";
    nope.innerHTML =
      '<div class="label">' + esc(c.cannotLabel || t.cannotLabel) + "</div><p>" + c.cannot + "</p>";
    body.appendChild(nope);
  }

  card.appendChild(body);
  return card;
}

function noteEl([bold, rest]) {
  const d = document.createElement("div");
  d.className = "note";
  d.innerHTML = "<b>" + esc(bold) + "</b> " + esc(rest);
  return d;
}

function render(lang) {
  const t = CONTENT[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.getElementById("back").textContent = t.back;

  const langs = document.getElementById("langs");
  langs.replaceChildren();
  for (const key of Object.keys(CONTENT)) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = CONTENT[key].label;
    b.setAttribute("aria-pressed", String(key === lang));
    b.onclick = () => {
      // Remembered, because the system language is not always the language
      // someone wants to read a manual in.
      try { localStorage.setItem("amcp-help-lang", key); } catch {}
      render(key);
    };
    langs.appendChild(b);
  }

  const page = document.createElement("div");

  const h1 = document.createElement("h1");
  h1.textContent = t.title;
  page.appendChild(h1);

  const lede = document.createElement("p");
  lede.className = "lede";
  lede.textContent = t.lede;
  page.appendChild(lede);

  page.appendChild(noteEl(t.topNote));

  const heading = (text) => {
    const h = document.createElement("h2");
    h.textContent = text;
    page.appendChild(h);
  };

  // All closed: the point of the accordion is that you open the one app you
  // came for instead of scrolling past three you did not.
  heading(t.appsH2);
  for (const a of t.apps) page.appendChild(cardEl(a, t));

  heading(t.imageH2);
  page.appendChild(cardEl(t.image, t));

  heading(t.setupH2);
  page.appendChild(cardEl(t.setup, t));

  heading(t.knowH2);
  for (const n of t.know) page.appendChild(noteEl(n));

  const foot = document.createElement("footer");
  const a = document.createElement("a");
  a.href = "/";
  a.textContent = t.backToSetup;
  foot.appendChild(a);
  page.appendChild(foot);

  document.getElementById("page").replaceChildren(page);
}

let stored = null;
try { stored = localStorage.getItem("amcp-help-lang"); } catch {}
const fromUrl = new URLSearchParams(location.search).get("lang");
const auto = (navigator.language || "en").toLowerCase().startsWith("it") ? "it" : "en";
render(CONTENT[fromUrl] ? fromUrl : (CONTENT[stored] ? stored : auto));
</script>
</body>
</html>
